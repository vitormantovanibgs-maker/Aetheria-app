name: Build Aetheria APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Baixar projeto
    uses: actions/checkout@v4

  - name: Configurar Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Instalar dependências
    run: npm install

  - name: Compilar projeto web
    run: npm run build
